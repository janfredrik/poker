# Poker game server. Video goes peer-to-peer, with Cloudflare Realtime TURN as the relay
# for players who can't connect directly (no TURN ports need to be open at home).
# Copy .env.example to .env and fill it in before `docker compose up -d`.
services:
  poker:
    image: ${POKER_IMAGE:-ghcr.io/janfredrik/poker:latest}   # built by GitHub Actions
    container_name: poker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # Unraid: 99:100
    ports:
      - "${POKER_PORT:-3000}:3000"          # nginx proxies to this
    environment:
      - TZ=${TZ:-Europe/Oslo}
      - TABLE_TTL_DAYS=14
      - CREATE_CODE=${CREATE_CODE:-}
      - CF_TURN_KEY_ID=${CF_TURN_KEY_ID:-}
      - CF_TURN_API_TOKEN=${CF_TURN_API_TOKEN:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_ANALYTICS_TOKEN=${CF_ANALYTICS_TOKEN:-}
      - TURN_MONTHLY_GB=${TURN_MONTHLY_GB:-1000}
      - TURN_WARN_PERCENT=${TURN_WARN_PERCENT:-50,80,95}
      - TURN_STOP_AT_LIMIT=${TURN_STOP_AT_LIMIT:-true}
      - TURN_BILLING_DAY=${TURN_BILLING_DAY:-1}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_FORMAT=${ALERT_WEBHOOK_FORMAT:-json}
    volumes:
      - ${DATA_PATH:-./data}:/data
